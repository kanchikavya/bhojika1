services:
  # ----------------------------------------------------
  # Unified Full-Stack Service: Django REST API + React 19 SPA
  # Exactly 1 single URL for everything:
  # - Frontend UI: https://<your-service>.onrender.com/
  # - REST API:    https://<your-service>.onrender.com/api/
  # ----------------------------------------------------
  - type: web
    name: food-fiesta
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && gunicorn food_fiesta_backend.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DB_NAME
        value: food_fiesta
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
